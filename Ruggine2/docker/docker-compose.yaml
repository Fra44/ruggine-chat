version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ruggine_postgres
    ports:
      - '5440:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    restart: always
    volumes:
      - postgres_data_poll_ruggine:/var/lib/postgresql/data

volumes:
  postgres_data_poll_ruggine:
