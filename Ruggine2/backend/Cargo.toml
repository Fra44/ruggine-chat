[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.0"
serde = { version = "1.0", features = ["derive"] }
diesel = { version = "2.0", features = ["postgres", "r2d2", "chrono"] }
dotenv = { version = "0.15" }
chrono = "^0"
strum_macros = "^0.27.2"
strum = { version = "^0.27.2", features = ["derive"] }
derive_more = "0.99.17"
bcrypt = "0.15"
jsonwebtoken = "9.2"
uuid = { version = "1.6", features = ["v4", "serde"] }
tokio = { version = "1.35", features = ["full"] }
env_logger = "0.11"
futures = "0.3"
sysinfo = "0.36.1"
actix-rt = "2.11.0"
