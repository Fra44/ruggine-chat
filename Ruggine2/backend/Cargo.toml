[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
diesel = { version = "2.0", features = ["postgres", "r2d2", "chrono"] }
dotenv = { version = "0.15" }
chrono = "^0"
strum_macros = "^0.27.2"
strum = { version = "^0.27.2", features = ["derive"] }
derive_more = "0.99.17"
bcrypt = "0.15"
jsonwebtoken = "9.2"
uuid = { version = "1.6", features = ["v4", "serde"] }
tokio = { version = "1.35", features = ["full"] }
env_logger = "0.11"
futures = "0.3"
sysinfo = "0.36.1"
actix-rt = "2.11.0"
actix-cors = "0.7"
actix = "0.13"
actix-web-actors = "4.0"
log = "0.4"
url = "2.4"
qstring = "0.7"

[profile.release]
opt-level = 'z'     # Ottimizza per la dimensione
lto = true          # Abilita Link Time Optimization
codegen-units = 1   # Riduce il parallelismo della compilazione per migliorare l'ottimizzazione
panic = 'abort'     
strip = true        # Rimuove simboli di debug