[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.0"
serde = { version = "1.0", features = ["derive"] }
diesel = { version = "2.0", features = ["postgres", "r2d2", "chrono"] }
dotenv = { version = "0.15" }
chrono = "^0"
strum_macros = "^0.27.2"
strum = { version = "^0.27.2", features = ["derive"] }
derive_more = "0.99.17"